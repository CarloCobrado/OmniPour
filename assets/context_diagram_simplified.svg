<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Times New Roman', Times, serif;">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
    </marker>
  </defs>

  <style>
    .entity-box { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
    .process-box { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
    .divider { stroke: #000000; stroke-width: 1.5; }
    .arrow-line { stroke: #000000; stroke-width: 1.5; fill: none; }
    .entity-text { font-size: 21px; fill: #000000; text-anchor: middle; dominant-baseline: middle; }
    .process-num { font-size: 22px; font-weight: normal; fill: #000000; text-anchor: middle; dominant-baseline: middle; }
    .process-title { font-size: 22px; fill: #000000; text-anchor: middle; }
    .flow-label { font-size: 16px; fill: #000000; text-anchor: middle; dominant-baseline: middle; }
  </style>

  <!-- Left Entity: Vendor -->
  <rect class="entity-box" x="40" y="65" width="130" height="130" />
  <text class="entity-text" x="105" y="130">Vendor</text>

  <!-- Central Process Box (Gane & Sarson format matching user sample) -->
  <rect class="process-box" x="320" y="30" width="200" height="200" />
  <!-- Horizontal partition line -->
  <line class="divider" x1="320" y1="65" x2="520" y2="65" />
  <text class="process-num" x="420" y="48">0</text>
  <text class="process-title" x="420" y="110">BeanTrack</text>
  <text class="process-title" x="420" y="145">Inventory</text>
  <text class="process-title" x="420" y="180">System</text>

  <!-- Right Entity: Customer -->
  <rect class="entity-box" x="670" y="65" width="130" height="130" />
  <text class="entity-text" x="735" y="130">Customer</text>

  <!-- ==================== FLOWS: VENDOR <-> SYSTEM ==================== -->
  <!-- Product list: Vendor -> System (Upper Arrow) -->
  <line class="arrow-line" x1="170" y1="95" x2="320" y2="95" marker-end="url(#arrow)" />
  <rect x="185" y="80" width="120" height="18" fill="#ffffff" />
  <text class="flow-label" x="245" y="89">Product list</text>

  <!-- Product details: System -> Vendor (Lower Arrow) -->
  <line class="arrow-line" x1="320" y1="165" x2="170" y2="165" marker-end="url(#arrow)" />
  <rect x="185" y="150" width="120" height="18" fill="#ffffff" />
  <text class="flow-label" x="245" y="159">Product details</text>

  <!-- ==================== FLOWS: CUSTOMER -> SYSTEM ==================== -->
  <!-- Product details / Order: Customer -> System -->
  <line class="arrow-line" x1="670" y1="130" x2="520" y2="130" marker-end="url(#arrow)" />
  <rect x="535" y="115" width="120" height="18" fill="#ffffff" />
  <text class="flow-label" x="595" y="124">Product details</text>

</svg>
