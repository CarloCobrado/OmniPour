<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 960" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <!-- Arrowhead / crow's foot markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
    </marker>
  </defs>

  <style>
    .table-box { fill: #ffffff; stroke: #000000; stroke-width: 1.8; rx: 4px; }
    .header-box { fill: #f1f5f9; stroke: #000000; stroke-width: 1.8; }
    .table-title { font-size: 15px; font-weight: bold; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
    .col-pk { font-size: 12px; font-weight: bold; fill: #b45309; }
    .col-fk { font-size: 12px; font-weight: bold; fill: #0369a1; }
    .col-name { font-size: 12px; fill: #1e293b; }
    .col-type { font-size: 11px; fill: #64748b; text-anchor: end; }
    .rel-line { stroke: #000000; stroke-width: 1.6; fill: none; }
    .rel-dash { stroke: #2563eb; stroke-width: 1.6; stroke-dasharray: 5,4; fill: none; }
    .card-text { font-size: 12px; font-weight: bold; fill: #000000; }
    .card-dash { font-size: 11px; font-weight: bold; fill: #2563eb; }
  </style>

  <!-- ==================== ROLES TABLE ==================== -->
  <g transform="translate(50, 60)">
    <rect class="table-box" x="0" y="0" width="230" height="90" />
    <rect class="header-box" x="0" y="0" width="230" height="30" />
    <text class="table-title" x="115" y="15">roles</text>
    <text class="col-pk" x="10" y="50">PK</text>
    <text class="col-name" x="35" y="50">id</text>
    <text class="col-type" x="220" y="50">int(11)</text>
    <text class="col-name" x="35" y="72">role_name</text>
    <text class="col-type" x="220" y="72">varchar(50)</text>
  </g>

  <!-- ==================== USERS TABLE ==================== -->
  <g transform="translate(50, 240)">
    <rect class="table-box" x="0" y="0" width="230" height="195" />
    <rect class="header-box" x="0" y="0" width="230" height="30" />
    <text class="table-title" x="115" y="15">users</text>
    <text class="col-pk" x="10" y="50">PK</text>
    <text class="col-name" x="35" y="50">id</text>
    <text class="col-type" x="220" y="50">int(11)</text>
    <text class="col-name" x="35" y="72">name</text>
    <text class="col-type" x="220" y="72">varchar(100)</text>
    <text class="col-name" x="35" y="94">email</text>
    <text class="col-type" x="220" y="94">varchar(120)</text>
    <text class="col-name" x="35" y="116">password</text>
    <text class="col-type" x="220" y="116">varchar(255)</text>
    <text class="col-fk" x="10" y="138">FK</text>
    <text class="col-name" x="35" y="138">role_id</text>
    <text class="col-type" x="220" y="138">int(11)</text>
    <text class="col-name" x="35" y="160">is_active</text>
    <text class="col-type" x="220" y="160">tinyint(1)</text>
    <text class="col-name" x="35" y="182">created_at</text>
    <text class="col-type" x="220" y="182">timestamp</text>
  </g>

  <!-- ==================== TRANSACTIONS TABLE ==================== -->
  <g transform="translate(420, 240)">
    <rect class="table-box" x="0" y="0" width="240" height="175" />
    <rect class="header-box" x="0" y="0" width="240" height="30" />
    <text class="table-title" x="120" y="15">transactions</text>
    <text class="col-pk" x="10" y="50">PK</text>
    <text class="col-name" x="35" y="50">id</text>
    <text class="col-type" x="230" y="50">int(11)</text>
    <text class="col-fk" x="10" y="72">FK</text>
    <text class="col-name" x="35" y="72">cashier_id</text>
    <text class="col-type" x="230" y="72">int(11)</text>
    <text class="col-name" x="35" y="94">total_amount</text>
    <text class="col-type" x="230" y="94">decimal(10,2)</text>
    <text class="col-name" x="35" y="116">payment_method</text>
    <text class="col-type" x="230" y="116">enum(Cash/Online)</text>
    <text class="col-name" x="35" y="138">payment_status</text>
    <text class="col-type" x="230" y="138">enum(Paid/Pending)</text>
    <text class="col-name" x="35" y="160">created_at</text>
    <text class="col-type" x="230" y="160">timestamp</text>
  </g>

  <!-- ==================== TRANSACTION_ITEMS TABLE ==================== -->
  <g transform="translate(770, 240)">
    <rect class="table-box" x="0" y="0" width="240" height="175" />
    <rect class="header-box" x="0" y="0" width="240" height="30" />
    <text class="table-title" x="120" y="15">transaction_items</text>
    <text class="col-pk" x="10" y="50">PK</text>
    <text class="col-name" x="35" y="50">id</text>
    <text class="col-type" x="230" y="50">int(11)</text>
    <text class="col-fk" x="10" y="72">FK</text>
    <text class="col-name" x="35" y="72">transaction_id</text>
    <text class="col-type" x="230" y="72">int(11)</text>
    <text class="col-fk" x="10" y="94">FK</text>
    <text class="col-name" x="35" y="94">product_id</text>
    <text class="col-type" x="230" y="94">int(11)</text>
    <text class="col-name" x="35" y="116">quantity</text>
    <text class="col-type" x="230" y="116">int(11)</text>
    <text class="col-name" x="35" y="138">unit_price</text>
    <text class="col-type" x="230" y="138">decimal(10,2)</text>
    <text class="col-name" x="35" y="160">subtotal</text>
    <text class="col-type" x="230" y="160">decimal(10,2)</text>
  </g>

  <!-- ==================== PRODUCTS TABLE ==================== -->
  <g transform="translate(770, 520)">
    <rect class="table-box" x="0" y="0" width="240" height="215" />
    <rect class="header-box" x="0" y="0" width="240" height="30" />
    <text class="table-title" x="120" y="15">products</text>
    <text class="col-pk" x="10" y="50">PK</text>
    <text class="col-name" x="35" y="50">id</text>
    <text class="col-type" x="230" y="50">int(11)</text>
    <text class="col-name" x="35" y="72">name</text>
    <text class="col-type" x="230" y="72">varchar(120)</text>
    <text class="col-name" x="35" y="94">category</text>
    <text class="col-type" x="230" y="94">varchar(80)</text>
    <text class="col-name" x="35" y="116">unit_price</text>
    <text class="col-type" x="230" y="116">decimal(10,2)</text>
    <text class="col-name" x="35" y="138">quantity</text>
    <text class="col-type" x="230" y="138">int(11)</text>
    <text class="col-name" x="35" y="160">reorder_level</text>
    <text class="col-type" x="230" y="160">int(11)</text>
    <text class="col-name" x="35" y="182">active</text>
    <text class="col-type" x="230" y="182">tinyint(1)</text>
    <text class="col-name" x="35" y="204">created_at</text>
    <text class="col-type" x="230" y="204">timestamp</text>
  </g>

  <!-- ==================== PRODUCT_RECIPE_ITEMS TABLE ==================== -->
  <g transform="translate(420, 560)">
    <rect class="table-box" x="0" y="0" width="240" height="115" />
    <rect class="header-box" x="0" y="0" width="240" height="30" />
    <text class="table-title" x="120" y="15">product_recipe_items</text>
    <text class="col-pk" x="10" y="50">PK,FK</text>
    <text class="col-name" x="50" y="50">product_id</text>
    <text class="col-type" x="230" y="50">int(11)</text>
    <text class="col-pk" x="10" y="75">PK,FK</text>
    <text class="col-name" x="50" y="75">ingredient_id</text>
    <text class="col-type" x="230" y="75">int(11)</text>
    <text class="col-name" x="50" y="100">quantity_required</text>
    <text class="col-type" x="230" y="100">decimal(12,3)</text>
  </g>

  <!-- ==================== INGREDIENTS TABLE ==================== -->
  <g transform="translate(420, 750)">
    <rect class="table-box" x="0" y="0" width="240" height="185" />
    <rect class="header-box" x="0" y="0" width="240" height="30" />
    <text class="table-title" x="120" y="15">ingredients</text>
    <text class="col-pk" x="10" y="50">PK</text>
    <text class="col-name" x="35" y="50">id</text>
    <text class="col-type" x="230" y="50">int(11)</text>
    <text class="col-name" x="35" y="72">name</text>
    <text class="col-type" x="230" y="72">varchar(120)</text>
    <text class="col-name" x="35" y="94">unit</text>
    <text class="col-type" x="230" y="94">varchar(30)</text>
    <text class="col-name" x="35" y="116">quantity</text>
    <text class="col-type" x="230" y="116">decimal(12,3)</text>
    <text class="col-name" x="35" y="138">reorder_level</text>
    <text class="col-type" x="230" y="138">decimal(12,3)</text>
    <text class="col-name" x="35" y="160">active</text>
    <text class="col-type" x="230" y="160">tinyint(1)</text>
    <text class="col-name" x="35" y="180">created_at</text>
    <text class="col-type" x="230" y="180">timestamp</text>
  </g>

  <!-- ==================== AUDIT_TRAIL TABLE ==================== -->
  <g transform="translate(50, 520)">
    <rect class="table-box" x="0" y="0" width="230" height="235" />
    <rect class="header-box" x="0" y="0" width="230" height="30" />
    <text class="table-title" x="115" y="15">audit_trail</text>
    <text class="col-pk" x="10" y="50">PK</text>
    <text class="col-name" x="35" y="50">id</text>
    <text class="col-type" x="220" y="50">int(11)</text>
    <text class="col-fk" x="10" y="72">FK</text>
    <text class="col-name" x="35" y="72">user_id</text>
    <text class="col-type" x="220" y="72">int(11)</text>
    <text class="col-name" x="35" y="94">action</text>
    <text class="col-type" x="220" y="94">varchar(120)</text>
    <text class="col-name" x="35" y="116">table_name</text>
    <text class="col-type" x="220" y="116">varchar(80)</text>
    <text class="col-name" x="35" y="138">record_id</text>
    <text class="col-type" x="220" y="138">int(11)</text>
    <text class="col-name" x="35" y="160">description</text>
    <text class="col-type" x="220" y="160">text</text>
    <text class="col-name" x="35" y="182">previous_hash</text>
    <text class="col-type" x="220" y="182">char(64)</text>
    <text class="col-name" x="35" y="204">entry_hash</text>
    <text class="col-type" x="220" y="204">char(64)</text>
    <text class="col-name" x="35" y="226">created_at</text>
    <text class="col-type" x="220" y="226">timestamp</text>
  </g>

  <!-- ==================== AUDIT_CHAIN_STATE TABLE ==================== -->
  <g transform="translate(50, 800)">
    <rect class="table-box" x="0" y="0" width="230" height="120" />
    <rect class="header-box" x="0" y="0" width="230" height="30" />
    <text class="table-title" x="115" y="15">audit_chain_state</text>
    <text class="col-pk" x="10" y="50">PK</text>
    <text class="col-name" x="35" y="50">id</text>
    <text class="col-type" x="220" y="50">tinyint(3)</text>
    <text class="col-fk" x="10" y="72" style="fill:#2563eb;">ref</text>
    <text class="col-name" x="35" y="72">last_id</text>
    <text class="col-type" x="220" y="72">int(11)</text>
    <text class="col-fk" x="10" y="94" style="fill:#2563eb;">ref</text>
    <text class="col-name" x="35" y="94">chain_start_id</text>
    <text class="col-type" x="220" y="94">int(11)</text>
    <text class="col-name" x="35" y="114">last_hash</text>
    <text class="col-type" x="220" y="114">char(64)</text>
  </g>

  <!-- ==================== RELATIONSHIPS & CONNECTING LINES ==================== -->

  <!-- roles (1) -> (M) users -->
  <path class="rel-line" d="M 165 150 L 165 240" />
  <text class="card-text" x="175" y="170">1</text>
  <text class="card-text" x="175" y="225">∞</text>

  <!-- users (1) -> (M) transactions -->
  <path class="rel-line" d="M 280 320 L 420 320" />
  <text class="card-text" x="295" y="312">1</text>
  <text class="card-text" x="400" y="312">∞</text>

  <!-- transactions (1) -> (M) transaction_items -->
  <path class="rel-line" d="M 660 320 L 770 320" />
  <text class="card-text" x="675" y="312">1</text>
  <text class="card-text" x="750" y="312">∞</text>

  <!-- products (1) -> (M) transaction_items -->
  <path class="rel-line" d="M 890 520 L 890 415" />
  <text class="card-text" x="900" y="500">1</text>
  <text class="card-text" x="900" y="435">∞</text>

  <!-- products (1) -> (M) product_recipe_items -->
  <path class="rel-line" d="M 770 615 L 660 615" />
  <text class="card-text" x="750" y="605">1</text>
  <text class="card-text" x="675" y="605">∞</text>

  <!-- ingredients (1) -> (M) product_recipe_items -->
  <path class="rel-line" d="M 540 750 L 540 675" />
  <text class="card-text" x="550" y="735">1</text>
  <text class="card-text" x="550" y="695">∞</text>

  <!-- users (1) -> (M) audit_trail -->
  <path class="rel-line" d="M 165 435 L 165 520" />
  <text class="card-text" x="175" y="455">1</text>
  <text class="card-text" x="175" y="505">∞</text>

  <!-- audit_trail (1) <.. (1) audit_chain_state (Logical State Pointer) -->
  <path class="rel-dash" d="M 165 755 L 165 800" />
  <text class="card-dash" x="175" y="775">tracks latest</text>
  <text class="card-dash" x="175" y="792">(1 : 1)</text>

</svg>
