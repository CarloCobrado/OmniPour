<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Times New Roman', Times, serif;">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
    </marker>
  </defs>

  <style>
    .entity-box { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
    .process-box { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
    .divider { stroke: #000000; stroke-width: 1.5; }
    .arrow-line { stroke: #000000; stroke-width: 1.5; fill: none; }
    .entity-text { font-size: 19px; fill: #000000; text-anchor: middle; dominant-baseline: middle; }
    .process-num { font-size: 20px; font-weight: bold; fill: #000000; text-anchor: middle; dominant-baseline: middle; }
    .process-title { font-size: 21px; fill: #000000; text-anchor: middle; line-height: 1.3; }
    .flow-label { font-size: 15px; fill: #000000; text-anchor: middle; dominant-baseline: middle; background-color: #ffffff; }
  </style>

  <!-- ==================== EXTERNAL ENTITIES ==================== -->
  
  <!-- Left Entity: Vendor / Supplier -->
  <rect class="entity-box" x="40" y="160" width="160" height="130" />
  <text class="entity-text" x="120" y="215">Vendor /</text>
  <text class="entity-text" x="120" y="240">Supplier</text>

  <!-- Central Process: 0 BeanTrack System (Gane & Sarson / DeMarco style) -->
  <rect class="process-box" x="350" y="125" width="230" height="200" />
  <!-- Horizontal divider separating process number and process name -->
  <line class="divider" x1="350" y1="165" x2="580" y2="165" />
  <text class="process-num" x="465" y="145">0</text>
  <text class="process-title" x="465" y="205">BeanTrack</text>
  <text class="process-title" x="465" y="235">Coffee Shop</text>
  <text class="process-title" x="465" y="265">POS &amp; Inventory</text>
  <text class="process-title" x="465" y="295">System</text>

  <!-- Right Entity: Customer -->
  <rect class="entity-box" x="730" y="160" width="160" height="130" />
  <text class="entity-text" x="810" y="225">Customer</text>

  <!-- Top Entity: Management / Supervisor -->
  <rect class="entity-box" x="385" y="10" width="160" height="65" />
  <text class="entity-text" x="465" y="42">Management</text>

  <!-- Bottom Entity: Administrator / Staff -->
  <rect class="entity-box" x="385" y="385" width="160" height="65" />
  <text class="entity-text" x="465" y="417">Administrator</text>

  <!-- ==================== FLOWS: VENDOR <-> SYSTEM ==================== -->
  <!-- Product / Ingredient list: Vendor -> System (Upper Arrow) -->
  <line class="arrow-line" x1="200" y1="195" x2="350" y2="195" marker-end="url(#arrow)" />
  <rect x="215" y="180" width="120" height="18" fill="#ffffff" />
  <text class="flow-label" x="275" y="189">Product list</text>

  <!-- Product / Stock details: System -> Vendor (Lower Arrow) -->
  <line class="arrow-line" x1="350" y1="255" x2="200" y2="255" marker-end="url(#arrow)" />
  <rect x="215" y="240" width="120" height="18" fill="#ffffff" />
  <text class="flow-label" x="275" y="249">Product details</text>

  <!-- ==================== FLOWS: CUSTOMER <-> SYSTEM ==================== -->
  <!-- Order / Payment: Customer -> System (Upper Arrow) -->
  <line class="arrow-line" x1="730" y1="200" x2="580" y2="200" marker-end="url(#arrow)" />
  <rect x="595" y="185" width="120" height="18" fill="#ffffff" />
  <text class="flow-label" x="655" y="194">Product details</text>

  <!-- Receipt / Order summary: System -> Customer (Lower Arrow) -->
  <line class="arrow-line" x1="580" y1="260" x2="730" y2="260" marker-end="url(#arrow)" />
  <rect x="595" y="245" width="120" height="18" fill="#ffffff" />
  <text class="flow-label" x="655" y="254">Sales receipt</text>

  <!-- ==================== FLOWS: MANAGEMENT <-> SYSTEM ==================== -->
  <!-- Query: Management -> System -->
  <line class="arrow-line" x1="435" y1="75" x2="435" y2="125" marker-end="url(#arrow)" />
  <!-- Reports: System -> Management -->
  <line class="arrow-line" x1="495" y1="125" x2="495" y2="75" marker-end="url(#arrow)" />
  <rect x="500" y="88" width="85" height="18" fill="#ffffff" />
  <text class="flow-label" x="542" y="97" style="font-size: 13px;">Reports</text>

  <!-- ==================== FLOWS: SYSTEM <-> ADMIN ==================== -->
  <!-- Config/Users: Admin -> System -->
  <line class="arrow-line" x1="435" y1="385" x2="435" y2="325" marker-end="url(#arrow)" />
  <rect x="355" y="343" width="75" height="18" fill="#ffffff" />
  <text class="flow-label" x="392" y="352" style="font-size: 13px;">User data</text>
  
  <!-- System Status/Logs: System -> Admin -->
  <line class="arrow-line" x1="495" y1="325" x2="495" y2="385" marker-end="url(#arrow)" />
  <rect x="500" y="343" width="80" height="18" fill="#ffffff" />
  <text class="flow-label" x="540" y="352" style="font-size: 13px;">Audit logs</text>

</svg>
