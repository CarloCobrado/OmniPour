<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 960" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Times New Roman', Times, serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
    </marker>
  </defs>

  <style>
    .entity-box { fill: #ffffff; stroke: #000000; stroke-width: 1.8; }
    .process-box { fill: #ffffff; stroke: #000000; stroke-width: 1.8; }
    .datastore-box { fill: #fcfcfc; stroke: #000000; stroke-width: 1.5; }
    .divider { stroke: #000000; stroke-width: 1.5; }
    .arrow-line { stroke: #000000; stroke-width: 1.4; fill: none; }
    .entity-title { font-size: 17px; font-weight: bold; fill: #000000; text-anchor: middle; dominant-baseline: middle; }
    .process-num { font-size: 16px; font-weight: bold; fill: #000000; text-anchor: middle; dominant-baseline: middle; }
    .process-title { font-size: 16px; font-weight: bold; fill: #000000; text-anchor: middle; }
    .ds-id { font-size: 14px; font-weight: bold; fill: #000000; dominant-baseline: middle; }
    .ds-name { font-size: 14px; font-weight: bold; fill: #000000; dominant-baseline: middle; }
    .flow-label { font-size: 12px; fill: #000000; text-anchor: middle; dominant-baseline: middle; background-color: #ffffff; }
  </style>

  <!-- ==================== EXTERNAL ENTITIES ==================== -->
  <!-- Top Left: Administrator -->
  <rect class="entity-box" x="40" y="50" width="160" height="70" />
  <text class="entity-title" x="120" y="78">System</text>
  <text class="entity-title" x="120" y="98">Administrator</text>

  <!-- Middle Left: Cashier -->
  <rect class="entity-box" x="40" y="270" width="160" height="70" />
  <text class="entity-title" x="120" y="305">Cashier</text>

  <!-- Far Left / Right: Customer -->
  <rect class="entity-box" x="40" y="470" width="160" height="70" />
  <text class="entity-title" x="120" y="505">Customer</text>

  <!-- Bottom Left: Stock Staff -->
  <rect class="entity-box" x="40" y="720" width="160" height="70" />
  <text class="entity-title" x="120" y="748">Stock Staff /</text>
  <text class="entity-title" x="120" y="768">Inventory</text>

  <!-- Top Right: Management -->
  <rect class="entity-box" x="1080" y="50" width="160" height="70" />
  <text class="entity-title" x="1160" y="85">Management</text>

  <!-- Middle Right: Supervisor -->
  <rect class="entity-box" x="1080" y="470" width="160" height="70" />
  <text class="entity-title" x="1160" y="505">Supervisor</text>

  <!-- ==================== PROCESSES (Gane & Sarson) ==================== -->
  
  <!-- Process 1.0: User Authentication & Account Management -->
  <rect class="process-box" x="310" y="50" width="220" height="95" />
  <line class="divider" x1="310" y1="78" x2="530" y2="78" />
  <text class="process-num" x="420" y="65">1.0</text>
  <text class="process-title" x="420" y="100">User Authentication &amp;</text>
  <text class="process-title" x="420" y="122">Account Management</text>

  <!-- Process 2.0: POS Sales & Order Processing -->
  <rect class="process-box" x="310" y="350" width="220" height="95" />
  <line class="divider" x1="310" y1="378" x2="530" y2="378" />
  <text class="process-num" x="420" y="365">2.0</text>
  <text class="process-title" x="420" y="400">POS Sales &amp; Order</text>
  <text class="process-title" x="420" y="422">Processing</text>

  <!-- Process 3.0: Inventory & Recipe Management -->
  <rect class="process-box" x="310" y="700" width="220" height="95" />
  <line class="divider" x1="310" y1="728" x2="530" y2="728" />
  <text class="process-num" x="420" y="715">3.0</text>
  <text class="process-title" x="420" y="750">Inventory &amp; Recipe</text>
  <text class="process-title" x="420" y="772">Management</text>

  <!-- Process 4.0: Tamper-Evident Audit Logging & Hash Verification -->
  <rect class="process-box" x="780" y="550" width="220" height="95" />
  <line class="divider" x1="780" y1="578" x2="1000" y2="578" />
  <text class="process-num" x="890" y="565">4.0</text>
  <text class="process-title" x="890" y="600">Tamper-Evident Audit &amp;</text>
  <text class="process-title" x="890" y="622">Chain Verification</text>

  <!-- Process 5.0: Sales & Inventory Reporting -->
  <rect class="process-box" x="780" y="150" width="220" height="95" />
  <line class="divider" x1="780" y1="178" x2="1000" y2="178" />
  <text class="process-num" x="890" y="165">5.0</text>
  <text class="process-title" x="890" y="200">Sales &amp; Inventory</text>
  <text class="process-title" x="890" y="222">Reporting</text>


  <!-- ==================== DATA STORES ==================== -->
  
  <!-- D1: Users & Roles -->
  <g transform="translate(600, 75)">
    <rect class="datastore-box" x="0" y="0" width="140" height="40" />
    <line class="divider" x1="35" y1="0" x2="35" y2="40" />
    <text class="ds-id" x="8" y="22">D1</text>
    <text class="ds-name" x="45" y="22">Users &amp; Roles</text>
  </g>

  <!-- D2: Transactions -->
  <g transform="translate(600, 375)">
    <rect class="datastore-box" x="0" y="0" width="140" height="40" />
    <line class="divider" x1="35" y1="0" x2="35" y2="40" />
    <text class="ds-id" x="8" y="22">D2</text>
    <text class="ds-name" x="45" y="22">Transactions</text>
  </g>

  <!-- D3: Products, Ingredients & Recipes -->
  <g transform="translate(600, 725)">
    <rect class="datastore-box" x="0" y="0" width="140" height="40" />
    <line class="divider" x1="35" y1="0" x2="35" y2="40" />
    <text class="ds-id" x="8" y="22">D3</text>
    <text class="ds-name" x="42" y="22">Products/Recipe</text>
  </g>

  <!-- D4: Audit Trail & Hash Chain State -->
  <g transform="translate(780, 725)">
    <rect class="datastore-box" x="0" y="0" width="220" height="40" />
    <line class="divider" x1="35" y1="0" x2="35" y2="40" />
    <text class="ds-id" x="8" y="22">D4</text>
    <text class="ds-name" x="45" y="22">Audit Trail &amp; Chain State</text>
  </g>


  <!-- ==================== FLOWS & LABELS ==================== -->

  <!-- Admin <-> Process 1.0 -->
  <line class="arrow-line" x1="200" y1="75" x2="310" y2="75" marker-end="url(#arrow)" />
  <rect x="210" y="60" width="90" height="15" fill="#ffffff" />
  <text class="flow-label" x="255" y="68">Account data</text>

  <line class="arrow-line" x1="310" y1="105" x2="200" y2="105" marker-end="url(#arrow)" />
  <rect x="210" y="108" width="90" height="15" fill="#ffffff" />
  <text class="flow-label" x="255" y="116">User status</text>

  <!-- Process 1.0 <-> D1 Users -->
  <line class="arrow-line" x1="530" y1="95" x2="600" y2="95" marker-end="url(#arrow)" />
  <rect x="540" y="80" width="55" height="15" fill="#ffffff" />
  <text class="flow-label" x="565" y="88">Store/get</text>

  <!-- Cashier <-> Process 2.0 -->
  <path class="arrow-line" d="M 200 295 L 340 295 L 340 350" marker-end="url(#arrow)" />
  <rect x="215" y="280" width="115" height="15" fill="#ffffff" />
  <text class="flow-label" x="270" y="288">Order &amp; payment</text>

  <path class="arrow-line" d="M 370 350 L 370 320 L 200 320" marker-end="url(#arrow)" />
  <rect x="215" y="325" width="115" height="15" fill="#ffffff" />
  <text class="flow-label" x="270" y="333">Receipt &amp; pricing</text>

  <!-- Customer <-> Process 2.0 -->
  <path class="arrow-line" d="M 200 490 L 340 490 L 340 445" marker-end="url(#arrow)" />
  <rect x="215" y="475" width="115" height="15" fill="#ffffff" />
  <text class="flow-label" x="270" y="483">Cash / online order</text>

  <path class="arrow-line" d="M 370 445 L 370 520 L 200 520" marker-end="url(#arrow)" />
  <rect x="215" y="525" width="115" height="15" fill="#ffffff" />
  <text class="flow-label" x="270" y="533">Printed receipt</text>

  <!-- Process 2.0 -> D2 Transactions -->
  <line class="arrow-line" x1="530" y1="395" x2="600" y2="395" marker-end="url(#arrow)" />
  <rect x="535" y="380" width="60" height="15" fill="#ffffff" />
  <text class="flow-label" x="565" y="388">Save sale</text>

  <!-- Process 2.0 <-> D3 Products/Inventory (Deduction & Price check) -->
  <path class="arrow-line" d="M 450 445 L 450 670 L 600 735" marker-end="url(#arrow)" />
  <rect x="455" y="600" width="135" height="15" fill="#ffffff" />
  <text class="flow-label" x="520" y="608">Deduct menu/recipe stock</text>

  <!-- Stock Staff <-> Process 3.0 -->
  <line class="arrow-line" x1="200" y1="735" x2="310" y2="735" marker-end="url(#arrow)" />
  <rect x="210" y="720" width="90" height="15" fill="#ffffff" />
  <text class="flow-label" x="255" y="728">Stock intake</text>

  <line class="arrow-line" x1="310" y1="765" x2="200" y2="765" marker-end="url(#arrow)" />
  <rect x="210" y="768" width="90" height="15" fill="#ffffff" />
  <text class="flow-label" x="255" y="776">Stock alerts</text>

  <!-- Process 3.0 <-> D3 Products & Recipes -->
  <line class="arrow-line" x1="530" y1="745" x2="600" y2="745" marker-end="url(#arrow)" />
  <rect x="535" y="730" width="60" height="15" fill="#ffffff" />
  <text class="flow-label" x="565" y="738">Update stock</text>

  <!-- Process 1.0, 2.0, 3.0 -> Process 4.0 (Audit Trail Logs) -->
  <path class="arrow-line" d="M 470 145 L 470 180 L 730 180 L 730 580 L 780 580" marker-end="url(#arrow)" />
  <rect x="670" y="315" width="110" height="15" fill="#ffffff" />
  <text class="flow-label" x="725" y="323">System action event</text>

  <!-- Process 4.0 <-> D4 Audit Trail -->
  <line class="arrow-line" x1="890" y1="645" x2="890" y2="725" marker-end="url(#arrow)" />
  <rect x="830" y="675" width="120" height="15" fill="#ffffff" />
  <text class="flow-label" x="890" y="683">Append SHA-256 hash</text>

  <!-- Supervisor <-> Process 4.0 -->
  <path class="arrow-line" d="M 1080 500 L 960 500 L 960 550" marker-end="url(#arrow)" />
  <rect x="975" y="485" width="100" height="15" fill="#ffffff" />
  <text class="flow-label" x="1025" y="493">Verify chain request</text>

  <path class="arrow-line" d="M 980 550 L 980 530 L 1080 530" marker-end="url(#arrow)" />
  <rect x="985" y="535" width="90" height="15" fill="#ffffff" />
  <text class="flow-label" x="1030" y="543">Integrity status</text>

  <!-- Supervisor -> Process 5.0 (Reports) -->
  <path class="arrow-line" d="M 1160 470 L 1160 220 L 1000 220" marker-end="url(#arrow)" />
  <rect x="1015" y="205" width="90" height="15" fill="#ffffff" />
  <text class="flow-label" x="1060" y="213">Review reports</text>

  <!-- Management <-> Process 5.0 (Reports) -->
  <line class="arrow-line" x1="1080" y1="85" x2="960" y2="85" marker-end="url(#arrow)" />
  <!-- path to process 5.0 -->
  <path class="arrow-line" d="M 960 85 L 960 150" marker-end="url(#arrow)" />
  <rect x="975" y="70" width="95" height="15" fill="#ffffff" />
  <text class="flow-label" x="1020" y="78">Report filters</text>

  <path class="arrow-line" d="M 980 150 L 980 115 L 1080 115" marker-end="url(#arrow)" />
  <rect x="985" y="120" width="90" height="15" fill="#ffffff" />
  <text class="flow-label" x="1030" y="128">Excel / CSV export</text>

  <!-- Process 5.0 reads D2 & D3 -->
  <path class="arrow-line" d="M 670 375 L 670 230 L 780 230" marker-end="url(#arrow)" />
  <rect x="680" y="250" width="85" height="15" fill="#ffffff" />
  <text class="flow-label" x="722" y="258">Sales data</text>

  <path class="arrow-line" d="M 740 735 L 760 735 L 760 240 L 780 240" marker-end="url(#arrow)" />
  <rect x="745" y="440" width="85" height="15" fill="#ffffff" />
  <text class="flow-label" x="785" y="448">Inventory data</text>

</svg>
